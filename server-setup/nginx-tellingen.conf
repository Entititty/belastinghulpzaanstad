# ============================================================
#  Conversiemeting voor belastinghulpzaanstad.nl
#
#  Plaats dit IN de http { } context van /etc/nginx/nginx.conf:
#      sudo cp server-setup/nginx-tellingen.conf /etc/nginx/conf.d/tellingen.conf
#  (/etc/nginx/conf.d/*.conf wordt daar standaard al geinclude.)
#
#  Het server-blok gebruikt daarna een location = /t met een access_log.
#  Uitlezen: node scripts/tellingen-rapport.js
#
#  WAAROM DIT MET NGINX EN NIET MET EEN PROGRAMMA
#  Er draait geen PHP en geen Node op deze server, en dat willen we zo
#  houden: elk extra proces is iets dat kan omvallen, updates nodig heeft
#  en geheugen kost op een kleine VPS. nginx kan zelf al precies wat hier
#  nodig is — een verzoek aannemen, er een regel van maken, en 204
#  teruggeven. Een access_log is per definitie append-only: de kernel
#  schrijft met O_APPEND, dus twee gelijktijdige verzoeken overschrijven
#  elkaar niet. Dat was de reden om geen JSON-bestand te gebruiken.
#
#  WAT ER IN EEN REGEL STAAT
#      {"t":"2026-08-28T14:00","e":"whatsapp","p":"/senioren/","v":""}
#  Tijdstip afgerond op het hele uur, gebeurtenis, pad, en bij afhaken de
#  naam van het laatst aangeraakte veld. Geen IP-adres, geen user-agent,
#  geen sessie, geen verwijzende pagina. Daarmee is een regel niet naar een
#  persoon terug te leiden en is er geen toestemming nodig.
# ============================================================

# ---- 1. Bots eruit --------------------------------------------------
# Het script telt pas na een echte klik, dus crawlers vallen al grotendeels
# af. Dit is de tweede zeef, voor scanners die wel JavaScript draaien.
map $http_user_agent $tel_geen_bot {
    default 1;
    ""      0;
    "~*(bot|crawl|spider|slurp|scrape|curl|wget|python|java/|headless|phantom|puppeteer|playwright|lighthouse|monitor|pingdom|uptime|preview|facebookexternalhit|whatsapp)" 0;
}

# ---- 2. Eigen bezoek eruit, mechanisme 2 ----------------------------
# js/tellingen.js kent ?mijzelf=1, maar dat zit in localStorage en dus per
# apparaat en per browser. Dit filter werkt WEL voor elk apparaat: alles wat
# vanaf het eigen IP-adres binnenkomt levert geen logregel op, of dat nu de
# laptop, de telefoon op de wifi of een tablet is.
#
# Het IP-adres staat bewust NIET in dit bestand. Dit bestand zit in git, en
# een thuis-IP is een persoonsgegeven. Zet het op de server in een eigen
# bestandje, precies zoals hieronder:
#
#     sudo tee /etc/nginx/conf.d/eigen-ip.map <<'IPS'
#     198.51.100.24  0;
#     2001:db8::1    0;
#     IPS
#     sudo nginx -t && sudo systemctl reload nginx
#
# Let op de puntkomma achter elke regel. Bestaat het bestand niet, dan is
# dat geen fout: de include gebruikt een sterretje en nginx slaat een
# patroon zonder treffers over.
map $remote_addr $tel_geen_eigen {
    default 1;
    include /etc/nginx/conf.d/eigen-ip*.map;
}

map "$tel_geen_bot$tel_geen_eigen" $tel_mee {
    default 0;
    "11"    1;
}

# ---- 3. Een bestand per dag -----------------------------------------
# Aanhalingstekens om de regex zijn VERPLICHT: nginx leest een losse { als
# het begin van een blok en slaat dan af met unexpected "{".
map $time_iso8601 $tel_dag {
    default "onbekend";
    "~^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})" $d;
}

# ---- 4. Tijdstip, afgerond op het hele uur --------------------------
# Bewust grof. Een tijdstip op de seconde maakt van een reeks regels een
# spoor dat je aan een persoon kunt koppelen; een uur niet.
map $time_iso8601 $tel_uur {
    default "";
    "~^(?<u>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2})" "${u}:00";
}

# ---- 5. De regel ----------------------------------------------------
# escape=json zorgt dat aanhalingstekens en stuurtekens in de parameters
# ontsnapt worden. Wie er met de hand rare tekens in probeert te krijgen,
# maakt het bestand daarmee niet stuk.
log_format tellingen escape=json '{"t":"$tel_uur","e":"$arg_e","p":"$arg_p","v":"$arg_v"}';

# Zonder dit opent en sluit nginx het dagbestand bij elk verzoek, want er
# staat een variabele in het pad.
open_log_file_cache max=8 inactive=1m valid=1m min_uses=1;
