# ============================================================
#  Cache-Control-map voor belastinghulpzaanstad.nl
#
#  Plaats dit IN de http { } context van /etc/nginx/nginx.conf,
#  bijvoorbeeld met:
#      include /etc/nginx/conf.d/cache-map.conf;
#  of door de inhoud rechtstreeks in http { } te zetten.
#
#  Het server-blok gebruikt daarna een enkele regel:
#      add_header Cache-Control $cache_control always;
#
#  Waarom een map en geen location-blokken: in nginx erft een location
#  de add_header-regels van het server-blok NIET meer zodra hij zelf een
#  add_header heeft. Elk cacheblok zou dus HSTS, nosniff, X-Frame-Options
#  en Referrer-Policy moeten herhalen, en een vergeten regel valt niet op.
#  Met een map staan alle add_header-regels op een plek.
# ============================================================

map $uri $cache_control {
    # HTML en al het overige: altijd hervalideren. De site wijzigt en de
    # seizoensbanner is datumgestuurd.
    default                                   "public, max-age=0, must-revalidate";

    # De stylesheet heeft een content-hash in de naam (scripts/hash-css.js),
    # dus een nieuwe inhoud is altijd een nieuwe URL. Die mag een jaar.
    ~*^/belasting\.[0-9a-f]{8}\.min\.css$     "public, max-age=31536000, immutable";

    # Lettertypen veranderen niet. Vervang je er een, geef hem dan een
    # andere bestandsnaam.
    ~*\.(?:woff2|woff|ttf|otf)$               "public, max-age=31536000, immutable";

    # CSS en JS zonder hash: een week. /js/consent.js en de andere
    # scripts hebben geen hash, dus die mogen niet immutable.
    ~*\.(?:css|js)$                           "public, max-age=604800";

    # Afbeeldingen, inclusief de og-plaatjes: een maand.
    ~*\.(?:png|jpe?g|svg|webp|avif|ico)$      "public, max-age=2592000";
}

# ------------------------------------------------------------
#  Uitrollen (twee bestanden, in deze volgorde)
#
#  1. de map in de http-context zetten:
#       sudo cp nginx-cache-map.conf /etc/nginx/conf.d/cache-map.conf
#     Let op: /etc/nginx/conf.d/*.conf wordt door de standaard nginx.conf
#     al binnen http { } geinclude. Controleer dat met:
#       grep -n "include /etc/nginx/conf.d" /etc/nginx/nginx.conf
#     Staat die regel er niet, zet de include dan zelf in http { }.
#
#  2. het server-blok bijwerken:
#       sudo cp nginx-belastinghulpzaanstad.conf \
#               /etc/nginx/sites-available/belastinghulpzaanstad.nl
#
#  3. testen en herladen:
#       sudo nginx -t && sudo systemctl reload nginx
#
#  Zet je stap 2 zonder stap 1, dan faalt nginx -t met
#  "unknown variable cache_control" en blijft de oude config draaien.
#  De site gaat er dus niet van plat, maar herladen doet hij niet.
#
#  Controleren vanaf je eigen machine:
#    curl -sI https://belastinghulpzaanstad.nl/ | grep -i "cache-control\|strict-transport"
#    curl -sI "https://belastinghulpzaanstad.nl/$(ls belasting.*.min.css)" | grep -i "cache-control\|strict-transport"
#    curl -sI https://belastinghulpzaanstad.nl/fonts/nunito-sans.woff2 | grep -i "cache-control\|strict-transport"
#  In alle drie de gevallen moet Strict-Transport-Security meekomen. Doet hij
#  dat niet, dan heeft er alsnog een location een eigen add_header gekregen.
# ------------------------------------------------------------
