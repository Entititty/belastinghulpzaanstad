# ============================================================
#  Volledige nginx-config voor belastinghulpzaanstad.nl
#  Locatie: /etc/nginx/sites-available/belastinghulpzaanstad.nl
#  Vervang de HELE inhoud van dat bestand door dit.
#
#  Lost op:
#   - hreflang-conflicten / dubbele content  -> www 301 naar non-www
#   - uncompressed JS/CSS                    -> gzip aan
#   - subdomeinen zonder HSTS                -> HSTS-header
#  Certbot-regels (SSL) blijven ongewijzigd.
# ============================================================

# ---- HTTPS: www  ->  non-www (301 redirect) ----
server {
    listen 443 ssl;
    server_name www.belastinghulpzaanstad.nl;

    ssl_certificate     /etc/letsencrypt/live/belastinghulpzaanstad.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/belastinghulpzaanstad.nl/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                   # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                     # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://belastinghulpzaanstad.nl$request_uri;
}

# ---- HTTPS: hoofd-site (non-www) ----
server {
    listen 443 ssl;
    server_name belastinghulpzaanstad.nl;

    root /var/www/belastinghulpzaanstad.nl/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/belastinghulpzaanstad.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/belastinghulpzaanstad.nl/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                   # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                     # managed by Certbot

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache-Control komt uit de map in nginx.conf (zie
    # server-setup/nginx-cache-map.conf). Bewust hier en niet in aparte
    # location-blokken: zodra een location een eigen add_header heeft,
    # erft die de headers hierboven NIET meer en verdwijnen HSTS en de
    # rest voor die bestanden. Met een map staat alles op een plek.
    add_header Cache-Control $cache_control always;

    # ---- Gzip-compressie ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml font/ttf font/otf;

    # Meetgegevens en rapporten nooit uitleveren, ook niet als ze per ongeluk
    # toch in git belanden. /data/seizoen.json en de andere site-JSON blijven
    # wel bereikbaar; die heeft de pagina zelf nodig.
    location ^~ /data/gsc/   { return 404; }
    location ^~ /reports/    { return 404; }
    location = /data/crawl.csv { return 404; }
    location ~ ^/data/baseline-.*\.md$ { return 404; }

    # Gereedschap en serverconfiguratie horen niet op het web. Het is code,
    # dus het hoort in git - maar de repo-root IS de webroot. Zonder deze
    # regels kan iedereen hardening.sh en deze config downloaden.
    location ^~ /scripts/      { return 404; }
    location ^~ /server-setup/ { return 404; }
    location ^~ /docs/        { return 404; }


    location / {
        try_files $uri $uri/ =404;
    }
}

# ---- HTTP (poort 80)  ->  HTTPS non-www ----
server {
    listen 80;
    listen [::]:80;
    server_name belastinghulpzaanstad.nl www.belastinghulpzaanstad.nl;
    return 301 https://belastinghulpzaanstad.nl$request_uri;
}
