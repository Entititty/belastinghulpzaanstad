# ============================================================
#  Volledige nginx-config voor belastinghulpzaanstad.nl
#  Locatie: /etc/nginx/sites-available/belastinghulpzaanstad.nl
#  Vervang de HELE inhoud van dat bestand door dit.
#
#  Lost op:
#   - hreflang-conflicten / dubbele content  -> www 301 naar non-www
#   - uncompressed JS/CSS                    -> gzip aan
#   - subdomeinen zonder HSTS                -> HSTS-header
#  Certbot-regels (SSL) blijven ongewijzigd.
# ============================================================

# ---- HTTPS: www  ->  non-www (301 redirect) ----
server {
    listen 443 ssl;
    server_name www.belastinghulpzaanstad.nl;

    ssl_certificate     /etc/letsencrypt/live/belastinghulpzaanstad.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/belastinghulpzaanstad.nl/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                   # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                     # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://belastinghulpzaanstad.nl$request_uri;
}

# ---- HTTPS: hoofd-site (non-www) ----
server {
    listen 443 ssl;
    server_name belastinghulpzaanstad.nl;

    root /var/www/belastinghulpzaanstad.nl/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/belastinghulpzaanstad.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/belastinghulpzaanstad.nl/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                   # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                     # managed by Certbot

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache-Control komt uit de map in nginx.conf (zie
    # server-setup/nginx-cache-map.conf). Bewust hier en niet in aparte
    # location-blokken: zodra een location een eigen add_header heeft,
    # erft die de headers hierboven NIET meer en verdwijnen HSTS en de
    # rest voor die bestanden. Met een map staat alles op een plek.
    add_header Cache-Control $cache_control always;

    # ---- Gzip-compressie ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml font/ttf font/otf;

    # Meetgegevens en rapporten nooit uitleveren, ook niet als ze per ongeluk
    # toch in git belanden. /data/seizoen.json en de andere site-JSON blijven
    # wel bereikbaar; die heeft de pagina zelf nodig.
    location ^~ /data/gsc/   { return 404; }
    location ^~ /reports/    { return 404; }
    location = /data/crawl.csv { return 404; }
    location ~ ^/data/baseline-.*\.md$ { return 404; }

    # Gereedschap en serverconfiguratie horen niet op het web. Het is code,
    # dus het hoort in git - maar de repo-root IS de webroot. Zonder deze
    # regels kan iedereen hardening.sh en deze config downloaden.
    location ^~ /scripts/      { return 404; }
    location ^~ /server-setup/ { return 404; }
    location ^~ /docs/        { return 404; }

    # Het overzicht van de conversiemeting. Zelfde reden als hierboven: dit
    # zijn bedrijfsgegevens en die horen niet op het web. Het bestand wordt op
    # de server gemaakt door scripts/tellingen-rapport.js, staat niet in git,
    # en is dus alleen via SSH te lezen. Zie server-setup/DEPLOY.md.
    location ^~ /intern/ { return 404; }

    # Vangnet. De logregels horen in /var/log/belastinghulp/tellingen/, dus
    # buiten de webroot. Zet iemand ze ooit toch hier neer, dan zijn ze niet
    # op te vragen.
    location ^~ /data/tellingen/ { return 404; }

    # Wie de pagina in zijn browsercache heeft van voor de omzetting, post nog
    # naar /contact.php en kreeg een kale nginx-404. Dat bericht is toch weg,
    # maar laat hem dan in ieder geval terugkomen op de contactpagina met de
    # foutmelding uit js/formulier.js, die zegt: bel of app ons.
    # 303 en niet 302, zodat de POST een GET wordt.
    location = /contact.php { return 303 /contact/?fout=1; }

    # Er draait geen PHP op deze server. Zonder deze regel serveert nginx een
    # .php-bestand als download en staat de broncode op straat; dat is precies
    # wat er met contact.php gebeurde. Het formulier gaat nu naar een externe
    # formulierdienst, dus PHP is hier nergens meer voor nodig.
    location ~ \.php$ { return 404; }

    # ── Samengevoegde pagina 301 -> opvolger ──────────────────
    # /blog/voorlopige-teruggave/ is in augustus 2026 samengevoegd met de
    # dienstenpagina. Het bestand blijft als vangnet staan (noindex plus
    # canonical), maar wie hier komt hoort een 301 te krijgen.
    location = /blog/voorlopige-teruggave/ {
        return 301 https://belastinghulpzaanstad.nl/diensten/voorlopige-teruggave/;
    }

    # /en/blog/preliminary-tax-refund/ is samengevoegd met de Engelse
    # dienstenpagina, net als de Nederlandse variant hierboven.
    location = /en/blog/preliminary-tax-refund/ {
        return 301 https://belastinghulpzaanstad.nl/en/services/preliminary-refund/;
    }

    # /blog/einddatum-belastingaangifte-2025/ is vervangen door de 2026-versie.
    # Deze regel stond wel in nginx-server-block-snippet.conf, maar niet in
    # deze config, en dit is de config die op de server draait.
    location = /blog/einddatum-belastingaangifte-2025/ {
        return 301 https://belastinghulpzaanstad.nl/blog/einddatum-belastingaangifte-2026/;
    }


    # ---- Conversiemeting ----
    # js/tellingen.js stuurt hier met sendBeacon een leeg POST-verzoek heen:
    #     /t?e=whatsapp&p=/senioren/
    # nginx antwoordt 204 en schrijft er een regel over weg. Er draait geen
    # programma; een access_log is append-only, dus twee gelijktijdige
    # verzoeken kunnen elkaar niet overschrijven. De maps, het logformaat en
    # de reden staan in server-setup/nginx-tellingen.conf, dat in de
    # http-context hoort.
    #
    # if=$tel_mee zorgt dat bots en het eigen IP-adres helemaal geen regel
    # opleveren. Deze access_log vervangt binnen dit blok de gewone
    # access_log, dus het IP-adres van de bezoeker komt hier nergens terecht.
    #
    # BEWUST GEEN add_header hier. Een location met een eigen add_header erft
    # de vier security headers uit het server-blok niet meer. Dat /t niet
    # gecachet mag worden staat daarom in de map in nginx-cache-map.conf.
    location = /t {
        access_log /var/log/belastinghulp/tellingen/$tel_dag.ndjson tellingen if=$tel_mee;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---- HTTP (poort 80)  ->  HTTPS non-www ----
server {
    listen 80;
    listen [::]:80;
    server_name belastinghulpzaanstad.nl www.belastinghulpzaanstad.nl;
    return 301 https://belastinghulpzaanstad.nl$request_uri;
}
