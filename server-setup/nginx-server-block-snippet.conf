# ============================================================
#  Nginx config voor belastinghulpzaanstad.nl
#  Locatie: doorgaans /etc/nginx/sites-available/belastinghulpzaanstad.nl
#  Toepassen: sudo nginx -t && sudo systemctl reload nginx
#
#  Deze versie lost op:
#   - Hreflang-conflicten (www + non-www serveerden allebei 200 → nu 301)
#   - "2 subdomeinen ondersteunen geen HSTS" (HSTS header toegevoegd)
#   - "Onvergecomprimeerde JS/CSS" (gzip aangezet)
# ============================================================

# ── Gzip-compressie ──────────────────────────────────────────
# (mag ook globaal in /etc/nginx/nginx.conf staan; hier is prima)
gzip              on;
gzip_comp_level   6;
gzip_min_length   256;
gzip_vary         on;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml
                  application/javascript application/json application/xml
                  application/rss+xml image/svg+xml font/ttf font/otf;

# ── HTTP → HTTPS (hoofddomein) ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name belastinghulpzaanstad.nl www.belastinghulpzaanstad.nl;
    return 301 https://belastinghulpzaanstad.nl$request_uri;
}

# ── HTTPS www → non-www (301) ────────────────────────────────
#  Lost de "2 subdomeinen" / hreflang-conflicten op: www serveert
#  niet langer een duplicaat, maar verwijst naar het hoofddomein.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.belastinghulpzaanstad.nl;

    # Zelfde certificaat als hoofddomein (Certbot dekt meestal beide)
    # ssl_certificate     /etc/letsencrypt/live/belastinghulpzaanstad.nl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/belastinghulpzaanstad.nl/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://belastinghulpzaanstad.nl$request_uri;
}

# ── Hoofd server block (non-www, HTTPS) ──────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name belastinghulpzaanstad.nl;

    # ── Rate limiting (vereist dat rate-limit.conf geladen is) ──
    limit_req  zone=general burst=40 nodelay;
    limit_conn conn_per_ip 20;

    # ── Security headers ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options        "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=()" always;

    # ── Blokkeer veelvoorkomende scanners ────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sh|sql|bak|zip|tar|gz)$ {
        return 404;
    }

    location = /robots.txt  { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    # ── Verlopen pagina 301 -> opvolger (2025 einddatum is vervangen) ──
    location = /blog/einddatum-belastingaangifte-2025/ {
        return 301 https://belastinghulpzaanstad.nl/blog/einddatum-belastingaangifte-2026/;
    }

    # ── Samengevoegde pagina 301 -> opvolger ──────────────────
    # /blog/voorlopige-teruggave/ is in augustus 2026 samengevoegd met de
    # dienstenpagina. Het bestand blijft als vangnet staan (noindex plus
    # canonical), maar wie hier komt hoort een 301 te krijgen.
    location = /blog/voorlopige-teruggave/ {
        return 301 https://belastinghulpzaanstad.nl/diensten/voorlopige-teruggave/;
    }

    # /en/blog/preliminary-tax-refund/ is samengevoegd met de Engelse
    # dienstenpagina, net als de Nederlandse variant hierboven.
    location = /en/blog/preliminary-tax-refund/ {
        return 301 https://belastinghulpzaanstad.nl/en/services/preliminary-refund/;
    }

    # ── Stricter rate limit voor contact/formulieren ─────────
    # (pas het pad aan als je een contactformulier hebt)
    # location /contact {
    #     limit_req zone=strict burst=5 nodelay;
    # }

    # ── Rest van je bestaande config ─────────────────────────
    root /var/www/belastinghulpzaanstad.nl;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # SSL — waarschijnlijk al ingesteld via Certbot
    # ssl_certificate     /etc/letsencrypt/live/belastinghulpzaanstad.nl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/belastinghulpzaanstad.nl/privkey.pem;
}
