# ============================================================
#  De app achter /api/ en /beheer/: limieten, logformaat en adres
#
#  Hoort IN de http { } context, net als de cache-map:
#      sudo cp server-setup/nginx-app.conf /etc/nginx/conf.d/belastinghulp-app.conf
#  (/etc/nginx/conf.d/*.conf wordt daar standaard al geinclude.)
#
#  VOLGORDE: eerst dit bestand, dan het server-blok. Het server-blok gebruikt
#  de zones, het logformaat en de upstream die hier staan. Andersom slaat
#  nginx -t af met: zero size shared memory zone "bhz_formulier".
# ============================================================

# Formulieren: 6 per minuut per IP-adres, met een kleine buffer. Een mens
# komt daar nooit aan; een script dat honderden aanvragen stuurt wel. De app
# heeft daarachter nog een eigen limiet per uur.
limit_req_zone $binary_remote_addr zone=bhz_formulier:10m rate=6r/m;

# Beheer: ruimer, want elke klik is een verzoek. Inlogpogingen remt de app
# zelf nog extra af.
limit_req_zone $binary_remote_addr zone=bhz_beheer:10m rate=60r/m;

# Een eigen logformaat zonder querystring. De afmeldlink in een mail heeft
# een token in de querystring; dat hoort niet in een logbestand.
log_format bhz_app '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

upstream belastinghulp_app {
    server 127.0.0.1:8790;
    keepalive 4;
}
