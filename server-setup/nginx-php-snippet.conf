# PHP-handler voor het contactformulier (/contact.php)
# Voeg dit toe binnen het bestaande 'server { ... }'-blok van
# belastinghulpzaanstad.nl (zie nginx-belastinghulpzaanstad.conf).
#
# Vereist: PHP-FPM geïnstalleerd op de VPS.
#   sudo apt install php-fpm
# Controleer het socket-pad (versie kan afwijken):
#   ls /run/php/     ->  bv. php8.3-fpm.sock
# Pas 'fastcgi_pass' hieronder aan naar het juiste pad.

location = /contact.php {
    include            fastcgi_params;
    fastcgi_param      SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass       unix:/run/php/php-fpm.sock;   # <-- pas versie aan indien nodig
    fastcgi_read_timeout 20s;
}

# Veiligheid: blokkeer alle andere .php-bestanden (alleen contact.php mag draaien).
location ~ \.php$ {
    return 404;
}

# Mail: zorg dat de server e-mail kan versturen (bijv. via een SMTP-relay of
# 'msmtp'/'sendmail'). Zonder werkende mail geeft het formulier /contact/?fout=1.
# TODO eigenaar: test na installatie één keer via /contact/ of de mail aankomt.
